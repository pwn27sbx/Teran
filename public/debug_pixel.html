<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; background: #333; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .container {
    width: 402px; height: 874px; position: relative; overflow: hidden; background: white;
  }
  img {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 10%;
    transform-origin: center 10%;
    transform: scale(1.575); /* 1.5 * 1.05 */
    opacity: 0.5;
  }
  canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    transform-origin: center 10%;
    transform: scale(1.05);
  }
</style>
</head>
<body>
  <div class="container">
    <img src="milo1_nobg.webp">
    <canvas id="c" width="402" height="874"></canvas>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const cat = new Image();
    cat.src = 'atreus1_nobg.webp';
    cat.onload = () => {
      const canvasW = 402; const canvasH = 874;
      const canvasRatio = canvasW / canvasH;
      const imgRatio = 2048 / 2048;
      
      let w = canvasW, h = canvasH, x = 0, y = 0;
      let hPos = 0.5, vPos = 0.1;
      
      if (imgRatio > canvasRatio) {
        w = canvasH * imgRatio;
        x = (canvasW - w) * hPos;
      } else {
        h = canvasW / imgRatio;
        y = (canvasH - h) * vPos;
      }
      
      const revealScale = 0.73;
      const revealOffsetY = -0.35;
      const bgScale = 1.5;
      
      const cx = x + w / 2;
      const cy = y + h / 2;
      w *= revealScale; h *= revealScale;
      x = cx - w / 2; y = cy - h / 2;
      y += h * revealOffsetY;
      
      const elemX = canvasW * hPos * (1 - bgScale);
      const elemY = canvasH * vPos * (1 - bgScale);
      
      w *= bgScale; h *= bgScale;
      x = elemX + x * bgScale; y = elemY + y * bgScale;
      
      ctx.globalAlpha = 0.5;
      ctx.drawImage(cat, x, y, w, h);
    };
  </script>
</body>
</html>
