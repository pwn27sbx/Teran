<!DOCTYPE html>
<html>
<head>
<style>
  .container {
    background: #f8f9fa;
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }
  .box {
    position: absolute;
    width: 200px;
    height: 200px;
    background: white;
    mix-blend-mode: multiply;
    animation: fade 2s infinite alternate;
  }
  @keyframes fade {
    0% { opacity: 0; transform: translateY(150px); }
    100% { opacity: 0.95; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="box"></div>
  </div>
</body>
</html>
